<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Sculptor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7F4;
    --surface:#FFFFFF;
    --surface-2:#FBE6E1;
    --ink:#3A2422;
    --ink-soft:#8A6B66;
    --ink-heading:#2E1B19;
    --line:rgba(58,36,34,.13);
    --accent:#B85C6B;
    --accent-soft:#B85C6B1c;
    --accent-gold:#C9A46A;
    --accent-gold-soft:#C9A46A22;
    --primary-ink:#FFFFFF;
    --shadow-sm:0 4px 16px -6px rgba(58,36,34,.16);
    --shadow:0 10px 34px -8px rgba(58,36,34,.22);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Fraunces',serif;
    --font-body:'Work Sans',sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink-heading); }
  p{ margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .container{ max-width:1120px; margin-inline:auto; padding-inline:24px; }
  @media (max-width:640px){ .container{ padding-inline:18px; } }
  [hidden]{ display:none !important; }

  .eyebrow{ font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px;
    padding:13px 26px; font-size:15px; font-weight:600; cursor:pointer; border:1px solid transparent;
    transition:transform .18s cubic-bezier(.34,1.4,.64,1), box-shadow .15s ease, background .15s ease; white-space:nowrap;
  }
  .btn:active{ transform:scale(1.07); }
  .btn-primary{ background:var(--accent); color:var(--primary-ink); box-shadow:var(--shadow-sm); }
  .btn-primary:hover{ box-shadow:var(--shadow); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-block{ width:100%; }
  .icon-btn svg{ width:20px; height:20px; }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:14px; }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; }
  .brand svg{ width:26px; height:26px; color:var(--accent); }
  .brand-name{ font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--ink-heading); }
  nav.main-nav{ display:flex; align-items:center; gap:24px; }
  nav.main-nav a{
    text-decoration:none; font-size:14px; font-weight:600; color:var(--ink-soft); display:inline-block;
    transform-origin:center bottom; transition:transform .16s cubic-bezier(.34,1.4,.64,1), color .15s ease;
  }
  nav.main-nav a:hover{ color:var(--ink); }
  nav.main-nav a:active{ transform:scale(1.5) !important; }
  @media (max-width:900px){ nav.main-nav{ display:none; } }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .lang-switch{ display:flex; gap:2px; padding:3px; border-radius:999px; border:1px solid var(--line); background:var(--surface); }
  .lang-switch button{
    font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:7px 11px; border-radius:999px; border:none;
    background:transparent; cursor:pointer; color:var(--ink-soft);
    transition:transform .18s cubic-bezier(.34,1.4,.64,1), background .15s ease, color .15s ease;
  }
  .lang-switch button[aria-pressed="true"]{ background:var(--accent); color:var(--primary-ink); transform:scale(1.12); }
  .lang-switch button:active{ transform:scale(1.18); }

  /* ---------- Hero ---------- */
  .hero{ position:relative; padding-block:64px 56px; overflow:hidden; text-align:center; }
  .hero-inner{ position:relative; z-index:2; max-width:680px; margin-inline:auto; }
  .hero-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    padding:7px 16px; border-radius:999px; font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;
  }
  .hero-badge svg{ width:14px; height:14px; color:var(--accent); }
  .hero h1{ font-size:clamp(32px,5.4vw,54px); line-height:1.08; margin-block:14px 16px; }
  .hero-lead{ font-size:17px; color:var(--ink-soft); max-width:52ch; margin:0 auto 30px; }
  .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .hero-glow{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 55% at 50% 15%, var(--accent-soft) 0%, transparent 70%);
  }
  #atmosCanvas{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  /* ---------- Section shell ---------- */
  section{ padding-block:60px; }
  .section-head{ max-width:640px; margin-bottom:36px; }
  .section-head.center{ margin-inline:auto; text-align:center; }
  .section-head h2{ font-size:clamp(26px,3.4vw,36px); margin-top:8px; }
  .section-head p{ color:var(--ink-soft); margin-top:12px; font-size:15.5px; }

  .divider{ display:flex; align-items:center; justify-content:center; gap:16px; padding:4px 0; }
  .divider::before, .divider::after{
    content:""; flex:1; max-width:220px; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  }
  .divider-mark{ width:6px; height:6px; background:var(--accent-gold); transform:rotate(45deg); border-radius:2px; flex:0 0 auto; }

  /* ---------- About ---------- */
  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  @media (max-width:820px){ .about-grid{ grid-template-columns:1fr; } }
  .about-visual{
    aspect-ratio:1/1; border-radius:var(--radius-lg); background:linear-gradient(150deg, var(--surface-2), var(--accent-gold-soft));
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .about-visual svg{ width:34%; height:34%; color:var(--accent); }
  .about-text p{ color:var(--ink-soft); font-size:15.5px; margin-bottom:14px; }
  .about-stats{ display:flex; gap:28px; margin-top:24px; flex-wrap:wrap; }
  .about-stat b{ display:block; font-family:var(--font-display); font-size:30px; color:var(--accent); }
  .about-stat span{ font-size:12.5px; color:var(--ink-soft); }

  /* ---------- Services ---------- */
  .service-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; }
  .service-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:26px 22px;
    box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:12px;
  }
  .service-icon{
    width:52px; height:52px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .service-icon svg{ width:26px; height:26px; }
  .service-card h3{ font-size:18px; }
  .service-card p{ font-size:14px; color:var(--ink-soft); }
  .service-meta{ margin-top:auto; padding-top:10px; font-size:12.5px; color:var(--accent); font-weight:600; }
  .service-items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .service-items li{ font-size:13.5px; color:var(--ink-soft); padding-inline-start:16px; position:relative; }
  .service-items li::before{ content:"•"; position:absolute; left:0; color:var(--accent-gold); }
  .service-card.coming-soon{ border-style:dashed; opacity:.82; }
  .soon-badge{
    display:inline-block; font-family:var(--font-body); font-size:10.5px; font-weight:700; letter-spacing:.04em;
    background:var(--accent-gold-soft); color:var(--accent-gold); padding:3px 9px; border-radius:999px; vertical-align:middle;
  }

  /* ---------- Prices ---------- */
  .country-toggle{ display:flex; gap:10px; justify-content:center; margin-bottom:30px; flex-wrap:wrap; }
  .country-btn{
    display:flex; align-items:center; gap:9px; padding:11px 22px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); cursor:pointer; font-size:14px; font-weight:600; color:var(--ink-soft);
    transition:transform .18s cubic-bezier(.34,1.4,.64,1), background .15s ease, color .15s ease, border-color .15s ease;
  }
  .country-btn .flag{ font-size:18px; }
  .country-btn[aria-pressed="true"]{ background:var(--accent); color:var(--primary-ink); border-color:var(--accent); transform:scale(1.08); }
  .country-btn:active{ transform:scale(1.14); }
  .price-table{ display:flex; flex-direction:column; gap:12px; max-width:760px; margin-inline:auto; }
  .price-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 22px; flex-wrap:wrap;
  }
  .price-row h4{ font-size:15.5px; font-weight:600; margin-bottom:3px; }
  .price-row .sub{ font-size:12.5px; color:var(--ink-soft); }
  .price-value{ font-family:var(--font-display); font-size:19px; color:var(--accent); font-weight:600; white-space:nowrap; }
  .price-value.pending{ font-family:var(--font-body); font-size:13.5px; color:var(--ink-soft); font-weight:600; font-style:italic; }
  .price-promo{
    margin-top:6px; text-align:center; font-size:13.5px; color:var(--accent-gold); font-weight:700;
    background:var(--accent-gold-soft); border-radius:var(--radius-sm); padding:10px 16px; max-width:760px; margin-inline:auto;
  }

  /* ---------- Location ---------- */
  .location-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:34px;
    max-width:560px; margin:0 auto; text-align:center; box-shadow:var(--shadow-sm);
  }
  .location-card .flag-big{ font-size:38px; margin-bottom:10px; }
  .location-card h3{ font-size:20px; margin-bottom:8px; }
  .location-card p{ color:var(--ink-soft); font-size:14.5px; margin-bottom:18px; }

  /* ---------- Process ---------- */
  .process-list{ display:flex; flex-direction:column; gap:20px; max-width:820px; margin-inline:auto; }
  .process-item{ display:flex; gap:18px; align-items:flex-start; }
  .process-num{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:16px;
  }
  .process-item h4{ font-size:16.5px; margin-bottom:6px; }
  .process-item p{ font-size:14.5px; color:var(--ink-soft); }

  /* ---------- Tips ---------- */
  .tips-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; }
  .tip-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; }
  .tip-icon{ width:40px; height:40px; border-radius:50%; background:var(--accent-gold-soft); color:var(--accent-gold); display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .tip-icon svg{ width:20px; height:20px; }
  .tip-card h4{ font-size:15px; margin-bottom:6px; }
  .tip-card p{ font-size:13.5px; color:var(--ink-soft); }
  .tips-note{
    margin-top:26px; padding:16px 20px; border-radius:var(--radius-md); background:var(--accent-soft);
    border:1px solid var(--accent); font-size:13.5px; color:var(--ink); display:flex; gap:10px; max-width:820px; margin-inline:auto;
  }
  .tips-note svg{ width:20px; height:20px; flex:0 0 auto; color:var(--accent); margin-top:1px; }

  /* ---------- Reviews (empty state) ---------- */
  .empty-state-block{
    text-align:center; padding:44px 24px; background:var(--surface); border:1px dashed var(--line);
    border-radius:var(--radius-lg); color:var(--ink-soft); max-width:560px; margin-inline:auto;
  }
  .empty-state-block svg{ width:32px; height:32px; color:var(--accent-gold); margin-bottom:14px; }
  .empty-state-block p{ font-size:14.5px; }

  /* ---------- Booking ---------- */
  .book-section{ background:var(--surface-2); }
  .book-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:32px;
    max-width:560px; margin-inline:auto; box-shadow:var(--shadow-sm);
  }
  .form-field{ margin-bottom:16px; }
  .form-field label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .form-field input, .form-field select, .form-field textarea{
    width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg);
    font-family:inherit; font-size:14.5px; color:var(--ink); resize:vertical;
  }
  .form-field input:focus, .form-field select:focus{ border-color:var(--accent); }
  .radio-row{ display:flex; gap:10px; }
  .radio-pill{ flex:1; }
  .radio-pill input{ display:none; }
  .radio-pill span{
    display:block; text-align:center; padding:10px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg); font-size:13.5px; cursor:pointer; font-weight:600; color:var(--ink-soft);
    transition:transform .18s cubic-bezier(.34,1.4,.64,1), background .15s ease, color .15s ease;
  }
  .radio-pill input:checked + span{ background:var(--accent); color:var(--primary-ink); border-color:var(--accent); transform:scale(1.05); }
  .radio-pill span:active{ transform:scale(1.1); }
  .form-note{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .whatsapp-missing{
    text-align:center; padding:16px; border-radius:var(--radius-md); background:var(--accent-gold-soft);
    color:var(--ink); font-size:13.5px;
  }

  footer.site-footer{ padding:34px 0; text-align:center; }
  footer.site-footer p{ font-size:12.5px; color:var(--ink-soft); }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="i-leaf"><path d="M5 20c0-8 6-14 14-14 0 8-6 14-14 14z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c3-3 6-6 14-14" fill="none" stroke="currentColor" stroke-width="1.6"/></g>
    <g id="i-bolt"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/></g>
    <g id="i-heart"><path d="M12 20s-7.5-4.9-9.7-9.4C.7 6.9 3 3.5 6.4 3.5c2 0 3.6 1.1 4.6 2.7 1-1.6 2.6-2.7 4.6-2.7 3.4 0 5.7 3.4 4.1 7.1C19.5 15.1 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g>
    <g id="i-sparkle"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z" fill="currentColor"/></g>
    <g id="i-droplet"><path d="M12 2s7 8.3 7 13a7 7 0 1 1-14 0c0-4.7 7-13 7-13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g>
    <g id="i-glow"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="M4.9 4.9l2.1 2.1"/><path d="M17 17l2.1 2.1"/><path d="M19.1 4.9 17 7"/><path d="M7 17l-2.1 2.1"/></g></g>
    <g id="i-shield"><path d="M12 3l7 3v6c0 4.8-3 8.4-7 9-4-.6-7-4.2-7-9V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-calendar"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-pin"><path d="M12 22s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/></g>
    <g id="i-chat"><path d="M4 20l1.3-4A8 8 0 1 1 9 19.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-sun"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v3"/><path d="M12 18.5v3"/><path d="M4.2 4.2l2 2"/><path d="M17.8 17.8l2 2"/><path d="M2.5 12h3"/><path d="M18.5 12h3"/><path d="M4.2 19.8l2-2"/><path d="M17.8 6.2l2-2"/></g></g>
  </defs>
</svg>

<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="#top">
      <svg><use href="#i-sparkle"/></svg>
      <span class="brand-name">Body Sculptor</span>
    </a>
    <nav class="main-nav">
      <a href="#about" data-i18n="navAbout"></a>
      <a href="#services" data-i18n="navServices"></a>
      <a href="#prices" data-i18n="navPrices"></a>
      <a href="#location" data-i18n="navLocation"></a>
      <a href="#process" data-i18n="navProcess"></a>
      <a href="#tips" data-i18n="navTips"></a>
      <a href="#reviews" data-i18n="navReviews"></a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="ru" aria-pressed="true">RU</button>
      </div>
      <a href="#book" class="btn btn-primary" data-i18n="navBook" style="padding:10px 18px; font-size:13.5px;"></a>
    </div>
  </div>
</header>

<main id="top">
  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <canvas id="atmosCanvas" aria-hidden="true"></canvas>
    <div class="container hero-inner">
      <span class="hero-badge"><svg><use href="#i-shield"/></svg><span data-i18n="heroBadge"></span></span>
      <span class="eyebrow" data-i18n="heroEyebrow"></span>
      <h1 data-i18n="heroTitle"></h1>
      <p class="hero-lead" data-i18n="heroLead"></p>
      <div class="hero-actions">
        <a href="#book" class="btn btn-primary" data-i18n="heroCta"></a>
        <a href="#services" class="btn btn-ghost" data-i18n="heroCta2"></a>
      </div>
    </div>
  </section>

  <div class="divider"><span class="divider-mark"></span></div>

  <!-- ============ ABOUT ============ -->
  <section id="about">
    <div class="container about-grid">
      <div class="about-visual"><svg><use href="#i-sparkle"/></svg></div>
      <div class="about-text">
        <span class="eyebrow" data-i18n="aboutEyebrow"></span>
        <h2 style="margin-top:8px; font-size:clamp(24px,3vw,32px);" data-i18n="aboutTitle"></h2>
        <p style="margin-top:16px;" data-i18n="aboutP1"></p>
        <p data-i18n="aboutP2"></p>
        <div class="about-stats">
          <div class="about-stat"><b>9+</b><span data-i18n="aboutStat1"></span></div>
          <div class="about-stat"><b>2</b><span data-i18n="aboutStat2"></span></div>
          <div class="about-stat"><b>✓</b><span data-i18n="aboutStat3"></span></div>
        </div>
      </div>
    </div>
  </section>

  <div class="divider"><span class="divider-mark"></span></div>

  <!-- ============ SERVICES ============ -->
  <section id="services">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="servicesEyebrow"></span>
        <h2 data-i18n="servicesTitle"></h2>
        <p data-i18n="servicesLead"></p>
      </div>
      <div class="service-grid" id="serviceGrid"></div>
    </div>
  </section>

  <div class="divider"><span class="divider-mark"></span></div>

  <!-- ============ PRICES ============ -->
  <section id="prices">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="pricesEyebrow"></span>
        <h2 data-i18n="pricesTitle"></h2>

      { nameKey:"priceCombo", noteKey:"priceComboNote", value:null },
      { nameKey:"priceFacial", value:null },
      { nameKey:"priceMassage", value:null },
      { nameKey:"priceBiorevit", value:null },
      { nameKey:"priceLiquid", value:null }
    ]
  };

  var PROCESS_STEPS = ["process1","process2","process3","process4","process5"];
  var TIPS = ["tip1","tip2","tip3","tip4","tip5","tip6","tip7"];

  var state = { lang:"ru", priceCountry:"ru", locCountry:"ru" };
  try{
    var savedLang = localStorage.getItem("bs_lang");
    if(savedLang === "en" || savedLang === "ru") state.lang = savedLang;
  }catch(e){}

  function t(key){
    var dict = STRINGS[state.lang] || STRINGS.ru;
    return dict[key] !== undefined ? dict[key] : (STRINGS.ru[key] || "");
  }

  var ICON_VIEWBOX = {
    "i-leaf":"0 0 24 24","i-bolt":"0 0 24 24","i-heart":"0 0 24 24","i-sparkle":"0 0 24 24",
    "i-droplet":"0 0 24 24","i-glow":"0 0 24 24","i-shield":"0 0 24 24","i-calendar":"0 0 24 24",
    "i-pin":"0 0 24 24","i-chat":"0 0 24 24","i-clock":"0 0 24 24","i-sun":"0 0 24 24"
  };
  function hydrateIcons(root){
    if(!root) return;
    root.querySelectorAll("svg").forEach(function(svg){
      var use = svg.querySelector("use");
      if(!use) return;
      var id = use.getAttribute("href").replace("#","");
      if(ICON_VIEWBOX[id] && !svg.getAttribute("viewBox")) svg.setAttribute("viewBox", ICON_VIEWBOX[id]);
    });
  }

  function applyLanguage(){
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("#langSwitch button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === state.lang ? "true" : "false");
    });
    try{ localStorage.setItem("bs_lang", state.lang); }catch(e){}
  }

  function renderServices(){
    var html = "";
    SERVICE_GROUPS.forEach(function(g){
      html += '<div class="service-card'+(g.comingSoon ? ' coming-soon' : '')+'">' +
        '<div class="service-icon"><svg><use href="#'+g.icon+'"/></svg></div>' +
        '<h3>'+t(g.nameKey)+(g.comingSoon ? ' <span class="soon-badge">'+t("soonBadge")+'</span>' : '')+'</h3>';
      if(g.leadKey) html += '<p>'+t(g.leadKey)+'</p>';
      if(g.descKey) html += '<p>'+t(g.descKey)+'</p>';
      if(g.items) html += '<ul class="service-items">' + g.items.map(function(k){ return '<li>'+t(k)+'</li>'; }).join('') + '</ul>';
      if(g.metaKey) html += '<div class="service-meta">'+t(g.metaKey)+'</div>';
      html += '</div>';
    });
    var wrap = document.getElementById("serviceGrid");
    wrap.innerHTML = html;
    hydrateIcons(wrap);
  }

  function renderPrices(){
    var rows = PRICES[state.priceCountry] || [];
    var html = "";
    rows.forEach(function(r){
      html += '<div class="price-row">' +
        '<div><h4>'+t(r.nameKey)+'</h4>' + (r.noteKey ? '<div class="sub">'+t(r.noteKey)+'</div>' : '') + '</div>' +
        '<div class="price-value'+(r.value ? '' : ' pending')+'">'+(r.value || t("pricePending"))+'</div>' +
        '</div>';
    });
    document.getElementById("priceTable").innerHTML = html;
    document.querySelectorAll('#priceCountryToggle .country-btn').forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-country") === state.priceCountry ? "true" : "false");
    });
  }

  function renderLocation(){
    var isRu = state.locCountry === "ru";
    var titleKey = isRu ? "locationRuTitle" : "locationEgTitle";
    var textKey = isRu ? "locationRuText" : "locationEgText";
    var flag = isRu ? "🇷🇺" : "🇪🇬";
    var html =
      '<div class="flag-big">'+flag+'</div>' +
      '<h3>'+t(titleKey)+'</h3>' +
      '<p>'+t(textKey)+'</p>' +
      '<a href="#book" class="btn btn-primary"><svg style="width:18px;height:18px;"><use href="#i-chat"/></svg>'+t("locationCta")+'</a>';
    var wrap = document.getElementById("locationCard");
    wrap.innerHTML = html;
    hydrateIcons(wrap);
    document.querySelectorAll('#locCountryToggle .country-btn').forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-country") === state.locCountry ? "true" : "false");
    });
  }

  function renderProcess(){
    var html = "";
    PROCESS_STEPS.forEach(function(key, i){
      html += '<div class="process-item">' +
        '<div class="process-num">'+(i+1)+'</div>' +
        '<div><h4>'+t(key+"Title")+'</h4><p>'+t(key+"Text")+'</p></div>' +
        '</div>';
    });
    document.getElementById("processList").innerHTML = html;
  }

  var TIP_ICONS = { tip1:"i-clock", tip2:"i-droplet", tip3:"i-droplet", tip4:"i-sparkle", tip5:"i-sun", tip6:"i-shield", tip7:"i-heart" };
  function renderTips(){
    var html = "";
    TIPS.forEach(function(key){
      html += '<div class="tip-card">' +
        '<div class="tip-icon"><svg><use href="#'+TIP_ICONS[key]+'"/></svg></div>' +
        '<h4>'+t(key+"Title")+'</h4><p>'+t(key+"Text")+'</p>' +
        '</div>';
    });
    var wrap = document.getElementById("tipsGrid");
    wrap.innerHTML = html;
    hydrateIcons(wrap);
  }

  function renderBookForm(){
    var select = document.getElementById("bookService");
    select.innerHTML = BOOKABLE_SERVICES.map(function(s){ return '<option value="'+s.id+'">'+t(s.nameKey)+'</option>'; }).join("");
  }

  function buildWhatsappMessage(){
    var country = document.querySelector('input[name="bookCountry"]:checked').value;
    var serviceEl = document.getElementById("bookService");
    var serviceName = serviceEl.options[serviceEl.selectedIndex].textContent;
    var name = document.getElementById("bookName").value.trim();
    var phone = document.getElementById("bookPhone").value.trim();
    var note = document.getElementById("bookNote").value.trim();
    var countryLabel = country === "ru" ? t("countryRuShort") : t("countryEgShort");
    var lines = [
      "Body Sculptor — " + t("bookTitle"),
      t("formCountryLabel") + ": " + countryLabel,
      t("formServiceLabel") + ": " + serviceName
    ];
    if(name) lines.push(t("formNameLabel") + ": " + name);
    if(phone) lines.push(t("formPhoneLabel") + ": " + phone);
    if(note) lines.push(t("formNoteLabel") + ": " + note);
    return lines.join("\n");
  }

  function initBooking(){
    var hint = document.getElementById("bookHint");
    var btn = document.getElementById("bookSubmit");
    if(!WHATSAPP){
      hint.textContent = t("whatsappMissing");
      btn.addEventListener("click", function(){ alert(t("whatsappMissing")); });
      return;
    }
    btn.addEventListener("click", function(){
      var msg = buildWhatsappMessage();
      window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank");
    });
  }

  function renderAll(){
    applyLanguage();
    renderServices();
    renderPrices();
    renderLocation();
    renderProcess();
    renderTips();
    renderBookForm();
  }

  document.getElementById("langSwitch").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-lang]");
    if(!btn) return;
    state.lang = btn.getAttribute("data-lang");
    renderAll();
  });
  document.getElementById("priceCountryToggle").addEventListener("click", function(e){
    var btn = e.target.closest(".country-btn");
    if(!btn) return;
    state.priceCountry = btn.getAttribute("data-country");
    renderPrices();
  });
  document.getElementById("locCountryToggle").addEventListener("click", function(e){
    var btn = e.target.closest(".country-btn");
    if(!btn) return;
    state.locCountry = btn.getAttribute("data-country");
    renderLocation();
  });

  /* =====================================================
     ATMOSPHERE — hero background: a fine line lattice with sparse
     dot anchors, a slow "breathing" opacity pulse, and a subtle
     pointer-driven drift. Plain canvas rather than a WebGL/shader
     stack — same visual read, no extra library weight, and the
     hero content in front of it works fine even if this never runs.
     ===================================================== */
  function initAtmosphere(){
    var canvas = document.getElementById("atmosCanvas");
    if(!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    if(!ctx) return;

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0;
    var pointer = { x:0.5, y:0.5 };
    var drift = { x:0, y:0 };
    var t0 = performance.now();
    var SPACING = 64;

    var accentHex = (getComputedStyle(document.documentElement).getPropertyValue("--accent-gold") || "#C9A46A").trim();
    var m = /^#([0-9a-f]{6})$/i.exec(accentHex);
    var rgbStr = m ? [parseInt(m[1].slice(0,2),16), parseInt(m[1].slice(2,4),16), parseInt(m[1].slice(4,6),16)].join(",") : "201,164,106";

    function resize(){
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function draw(now){
      var elapsed = (now - t0) / 1000;
      var pulse = 0.5 + 0.5 * Math.sin(elapsed * 0.4);
      var lineAlpha = 0.05 + pulse * 0.05;
      var dotAlpha = 0.16 + (0.5 + 0.5 * Math.sin(elapsed * 0.4 + 1.1)) * 0.14;

      var targetDx = (pointer.x - 0.5) * 14;
      var targetDy = (pointer.y - 0.5) * 14;
      drift.x += (targetDx - drift.x) * 0.03;
      drift.y += (targetDy - drift.y) * 0.03;
      var offsetX = drift.x % SPACING;
      var offsetY = drift.y % SPACING;

      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(" + rgbStr + "," + lineAlpha + ")";
      ctx.lineWidth = 1;
      for(var x = -SPACING; x <= w + SPACING; x += SPACING){
        ctx.beginPath(); ctx.moveTo(x + offsetX, 0); ctx.lineTo(x + offsetX, h); ctx.stroke();
      }
      for(var y = -SPACING; y <= h + SPACING; y += SPACING){
        ctx.beginPath(); ctx.moveTo(0, y + offsetY); ctx.lineTo(w, y + offsetY); ctx.stroke();
      }
      ctx.fillStyle = "rgba(" + rgbStr + "," + dotAlpha + ")";
      for(var xi = -SPACING; xi <= w + SPACING; xi += SPACING){
        for(var yi = -SPACING; yi <= h + SPACING; yi += SPACING){
          ctx.beginPath(); ctx.arc(xi + offsetX, yi + offsetY, 1.6, 0, Math.PI * 2); ctx.fill();
        }
      }
      if(!reduceMotion) requestAnimationFrame(draw);
    }

    if(reduceMotion){
      draw(t0); // one static frame — no animation loop, no pointer tracking
    } else {
      canvas.parentElement.addEventListener("pointermove", function(e){
        var rect = canvas.parentElement.getBoundingClientRect();
        pointer.x = (e.clientX - rect.left) / rect.width;
        pointer.y = (e.clientY - rect.top) / rect.height;
      });
      requestAnimationFrame(draw);
    }
  }

  /* =====================================================
     NAV MAGNIFY — macOS-Dock-style lens: links scale up based on
     how close the cursor is to each one, tapering off with distance.
     ===================================================== */
  function initNavMagnify(){
    var nav = document.querySelector("nav.main-nav");
    if(!nav) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;
    var MAX_SCALE = 1.45, RADIUS = 90;

    nav.addEventListener("mousemove", function(e){
      var links = nav.querySelectorAll("a");
      links.forEach(function(link){
        var rect = link.getBoundingClientRect();
        var center = rect.left + rect.width / 2;
        var dist = Math.abs(e.clientX - center);
        var scale = dist < RADIUS ? 1 + (MAX_SCALE - 1) * (1 - dist / RADIUS) : 1;
        link.style.transform = "scale(" + scale.toFixed(3) + ")";
      });
    });
    nav.addEventListener("mouseleave", function(){
      nav.querySelectorAll("a").forEach(function(link){ link.style.transform = "scale(1)"; });
    });
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  hydrateIcons(document);
  renderAll();
  initBooking();
  initAtmosphere();
  initNavMagnify();
})();
</script>
